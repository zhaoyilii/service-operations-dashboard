services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - service_ops_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  service_ops_data:
